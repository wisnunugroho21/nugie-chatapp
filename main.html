<!doctype html>
<html>
    <head>
        <title>Chatbot Coba</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
        />
        <link rel="stylesheet" href="main.css" />
    </head>
    <body>
        <div class="app">
            <!-- ==================== SIDEBAR ==================== -->
            <aside class="sidebar">
                <header class="side-head">
                    <div class="avatar a1" aria-label="Your profile">NU</div>
                    <div class="spacer"></div>
                    <button
                        class="icon-btn"
                        id="btnSimIncoming"
                        aria-label="Simulate an incoming call"
                        title="Simulate an incoming call"
                    >
                        <span class="material-symbols-outlined">
                            phone_callback
                        </span>
                    </button>
                    <button
                        class="icon-btn"
                        id="btnNewChat"
                        aria-label="New chat"
                    >
                        <span class="material-symbols-outlined">
                            chat_add_on
                        </span>
                    </button>
                    <button
                        class="icon-btn"
                        id="btnListMenu"
                        aria-label="Chat list options"
                        aria-haspopup="menu"
                        aria-expanded="false"
                    >
                        <span class="material-symbols-outlined">
                            more_vert
                        </span>
                    </button>
                </header>

                <div class="search-wrap">
                    <div class="search">
                        <span class="material-symbols-outlined"> search </span>
                        <input
                            id="chatSearch"
                            type="search"
                            placeholder="Search or start a new chat"
                            aria-label="Search chats"
                        />
                        <button
                            class="search-clear"
                            id="chatSearchClear"
                            type="button"
                            aria-label="Clear search"
                            style="display: none"
                        >
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                </div>

                <div class="filters" role="group" aria-label="Filter chats">
                    <button class="chip" data-filter="all" aria-pressed="true">
                        All
                    </button>
                    <button
                        class="chip"
                        data-filter="unread"
                        aria-pressed="false"
                    >
                        Unread
                    </button>
                </div>

                <!-- Rows are rendered from the CHATS array in JS -->
                <div
                    class="chat-list"
                    role="listbox"
                    aria-label="Conversations"
                ></div>

                <!-- ============ NEW CHAT PANEL ============ -->
                <section
                    class="new-chat"
                    id="newChat"
                    aria-label="New chat"
                    aria-hidden="true"
                    style="transform: translateX(-102%); visibility: hidden"
                >
                    <header class="side-head np-head">
                        <button
                            class="icon-btn"
                            id="ncBack"
                            aria-label="Back to chats"
                        >
                            <span class="material-symbols-outlined">
                                arrow_left_alt
                            </span>
                        </button>
                        <div class="np-title">
                            <div class="np-name" id="ncTitle">New chat</div>
                            <div class="np-sub" id="ncSub">
                                Pick someone to message
                            </div>
                        </div>
                    </header>

                    <div class="search-wrap">
                        <div class="search">
                            <span class="material-symbols-outlined">
                                search
                            </span>
                            <input
                                id="ncSearch"
                                type="search"
                                placeholder="Search name or number"
                                aria-label="Search contacts"
                            />
                        </div>
                    </div>

                    <div class="np-list" id="ncList"></div>

                    <footer class="np-foot" id="ncFoot" style="display: none">
                        <div class="np-chips" id="ncChips"></div>
                        <div class="np-make">
                            <div class="field">
                                <input
                                    id="ncGroupName"
                                    type="text"
                                    placeholder="Group name"
                                    aria-label="Group name"
                                />
                            </div>
                            <button
                                class="np-fab"
                                id="ncCreate"
                                aria-label="Create group"
                                disabled
                            >
                                <span class="material-symbols-outlined">
                                    arrow_right_alt
                                </span>
                            </button>
                        </div>
                    </footer>
                </section>
            </aside>

            <!-- ==================== CHAT ==================== -->
            <main class="chat">
                <div class="chat-head">
                    <span
                        class="back-btn material-symbols-outlined"
                        id="btnBack"
                        role="button"
                        tabindex="0"
                    >
                        arrow_left_alt
                    </span>
                    <div class="avatar a1" id="chatAvatar">DA</div>
                    <div class="ch-info">
                        <div class="ch-name">Dispatch Armada</div>
                        <div class="ch-sub">You, Pak Budi, Rina, Fajar, +6</div>
                    </div>
                    <button
                        class="icon-btn"
                        id="btnVoiceCall"
                        aria-label="Voice call"
                    >
                        <span class="material-symbols-outlined"> call </span>
                    </button>
                    <button
                        class="icon-btn"
                        id="btnVideoCall"
                        aria-label="Video call"
                    >
                        <span class="material-symbols-outlined">
                            videocam
                        </span>
                    </button>
                    <button
                        class="icon-btn"
                        id="btnChatMenu"
                        aria-label="Chat options"
                        aria-haspopup="menu"
                        aria-expanded="false"
                    >
                        <span class="material-symbols-outlined">
                            more_vert
                        </span>
                    </button>
                </div>

                <!-- Bubbles are rendered from the MESSAGES data in JS -->
                <div id="chat_thread" class="thread"></div>

                <div class="composer">
                    <button class="icon-btn" aria-label="Attach file">
                        <span class="material-symbols-outlined">
                            attach_file
                        </span>
                    </button>
                    <div class="field">
                        <input
                            class="msg-input"
                            type="text"
                            placeholder="Type a message"
                            aria-label="Type a message"
                        />
                    </div>
                    <button
                        class="icon-btn btn-mic"
                        aria-label="Record voice message"
                    >
                        <span class="material-symbols-outlined"> mic </span>
                    </button>
                    <button class="icon-btn btn-send" aria-label="Send message">
                        <span class="material-symbols-outlined"> send </span>
                    </button>
                </div>
            </main>
        </div>

        <div
            class="sr-only"
            id="announcer"
            role="status"
            aria-live="polite"
        ></div>

        <!-- ==================== SHARED MENU + SNACKBAR ==================== -->
        <div class="menu" id="menu" role="menu" style="display: none"></div>
        <div class="snack" id="snack" role="status" style="display: none"></div>

        <!-- ==================== CALL SCREEN ==================== -->
        <div
            class="call-overlay"
            id="callOverlay"
            role="dialog"
            aria-modal="true"
            aria-label="Call"
            style="display: none"
        >
            <div class="call-card" id="callCard">
                <div class="call-stage" id="callStage" style="display: none">
                    <div class="avatar a1" id="callStageAvatar">DA</div>
                    <div class="call-self">
                        <span class="material-symbols-outlined">person</span>
                        You
                    </div>
                </div>

                <div class="avatar a1" id="callAvatar">DA</div>
                <div class="call-name" id="callName">—</div>
                <div class="call-status" id="callStatus">Calling…</div>
                <div class="call-flags" id="callFlags"></div>

                <div class="call-e2e">
                    <span class="material-symbols-outlined">lock</span>
                    End-to-end encrypted
                </div>

                <div class="call-controls">
                    <button
                        class="call-btn"
                        id="callMute"
                        aria-pressed="false"
                        aria-label="Mute microphone"
                    >
                        <span class="material-symbols-outlined">mic</span>
                    </button>
                    <button
                        class="call-btn"
                        id="callCam"
                        aria-pressed="false"
                        aria-label="Turn camera on"
                    >
                        <span class="material-symbols-outlined"
                            >videocam_off</span
                        >
                    </button>
                    <button
                        class="call-btn"
                        id="callSpeaker"
                        aria-pressed="false"
                        aria-label="Speaker"
                    >
                        <span class="material-symbols-outlined">volume_up</span>
                    </button>
                    <button
                        class="call-btn end"
                        id="callEnd"
                        aria-label="End call"
                    >
                        <span class="material-symbols-outlined">call_end</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== INCOMING CALL ==================== -->
        <div
            class="call-toast"
            id="callToast"
            role="alertdialog"
            aria-label="Incoming call"
            style="display: none"
        >
            <div class="avatar a3" id="ctAvatar">RP</div>
            <div class="ct-body">
                <div class="ct-name" id="ctName">—</div>
                <div class="ct-sub" id="ctSub">Incoming voice call</div>
            </div>
            <div class="ct-actions">
                <button
                    class="ct-btn decline"
                    id="ctDecline"
                    aria-label="Decline call"
                >
                    <span class="material-symbols-outlined">call_end</span>
                </button>
                <button
                    class="ct-btn accept"
                    id="ctAccept"
                    aria-label="Accept call"
                >
                    <span class="material-symbols-outlined">call</span>
                </button>
            </div>
        </div>

        <!-- ES module: serve over http(s), not file:// -->
        <script type="module" src="main.js"></script>
    </body>
</html>
